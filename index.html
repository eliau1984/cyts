<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YC Technological Solutions</title><link rel="icon" href="favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="lang-page"><section class="lang-card"><div class="lang-cover"></div><div class="lang-content"><div class="kicker">Engineering · Technology · Innovation</div><h1>YC Technological Solutions</h1><p class="section-lead">Choose your preferred language / בחרו שפה</p><div class="lang-buttons"><a class="btn" href="cyts-en.html">English</a><a class="btn secondary" href="cyts-he.html">עברית</a></div></div></section></main>
<script>
(function(){
  const targets = [
    '.section', '.card', '.proof-card', '.about-box', '.mini-banner', '.contact-panel', '.section-title', '.section-lead', '.lang-card'
  ];
  const nodes = Array.from(document.querySelectorAll(targets.join(',')));
  nodes.forEach((el, index) => {
    el.classList.add('reveal');
    if (el.classList.contains('card') || el.classList.contains('proof-card')) {
      el.classList.add('reveal-delay-' + ((index % 5) + 1));
    }
  });
  if (!('IntersectionObserver' in window)) {
    nodes.forEach(el => el.classList.add('is-visible'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.14, rootMargin: '0px 0px -70px 0px' });
  nodes.forEach(el => observer.observe(el));
})();
</script>
</body></html>
